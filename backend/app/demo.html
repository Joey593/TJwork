<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Lab · 演示被测应用</title><style>body{font:16px system-ui;background:#f3f5f9;color:#233048;margin:0;padding:48px}main{max-width:900px;margin:auto}header{margin-bottom:32px}small{color:#6d7d94}h1{font-size:32px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}section{background:white;border:1px solid #e4e9f1;border-radius:16px;padding:28px}label{display:block;font-size:14px;margin:15px 0 6px}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cdd5e2;border-radius:8px;font:inherit}button{margin-top:16px;background:#5148e5;border:0;color:white;padding:12px 24px;border-radius:8px;cursor:pointer}output{display:block;margin-top:16px;font-size:14px;min-height:22px;color:#285e4c}.note{padding:14px;background:#fff7dd;border-radius:8px;font-size:13px}@media(max-width:700px){body{padding:20px}.grid{grid-template-columns:1fr}}</style></head><body><main><header><small>AURORA TEST / SYSTEM UNDER TEST</small><h1>Campus Lab 演示应用</h1><p>登录、注册、课程查询与反馈表单。每条测试使用独立浏览器上下文。</p><p class="note">演示账号 student / Study123! · URL 参数 ?bug=login、register、search 或 form 可启用对应预置缺陷。</p></header><div class="grid"><section><h2>账号登录</h2><label for="username">用户名</label><input id="username" data-testid="login-username" autocomplete="off"><label for="password">密码</label><input id="password" type="password"><button onclick="login()">登录</button><output data-testid="login-result"></output></section><section><h2>账号注册</h2><label for="email">注册邮箱</label><input id="email"><button onclick="register()">注册</button><output data-testid="register-result"></output></section><section><h2>课程查询</h2><label for="query">搜索关键词</label><input id="query"><button onclick="search()">查询</button><output data-testid="search-result"></output></section><section><h2>意见反馈</h2><label for="feedback">反馈内容</label><textarea id="feedback"></textarea><button onclick="submitForm()">提交反馈</button><output data-testid="form-result"></output></section></div></main><script>
const bug=new URLSearchParams(location.search).get('bug');const val=id=>document.getElementById(id).value;const out=(id,text)=>document.querySelector('[data-testid="'+id+'-result"]').textContent=text;
function login(){out('login',val('username')==='student'&&(val('password')==='Study123!'||bug==='login')?'欢迎回来，student':'用户名或密码错误')}
function register(){out('register',/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val('email'))||bug==='register'?'注册成功':'请输入有效邮箱')}
function search(){out('search',bug==='search'?'未找到结果':val('query').toLowerCase().includes('playwright')?'Playwright 实战':'未找到结果')}
function submitForm(){out('form',val('feedback').trim()||bug==='form'?'提交成功':'请填写反馈内容')}
</script></body></html>
