name: Platform CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest tests -q --junitxml=../qa/api-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-results
          path: qa/
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Start demo and execute maintained baseline
        env:
          TEST_BROWSER: ${{ matrix.browser }}
          DISABLE_WORKER: '1'
        run: |
          (cd backend && uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../qa-server.log 2>&1) &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break || sleep 1; done
          python experiments/ci_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            qa/ci-smoke/
            qa-server.log
